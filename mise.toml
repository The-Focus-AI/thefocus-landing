[tools]
node = "24"
pnpm = "10"
gh = "latest"
ripgrep = "latest"
fd = "latest"

[env]
_.path = ['./node_modules/.bin']

[tasks.install]
description = "Install dependencies and locked agent skills"
run = '''
set -euo pipefail
pnpm install
npx skills experimental_install
'''

[tasks.pnpm-install]
description = 'Installs dependencies with pnpm'
run = 'pnpm install'
sources = ['package.json', 'pnpm-lock.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.dev]
description = 'Runs the Astro dev server'
run = 'pnpm dev'
depends = ['pnpm-install']

[tasks.clean]
description = 'Clears out dist'
run = 'rm -rf dist/'

[tasks.build]
description = 'Builds the production site into dist/'
run = ['pnpm build', 'du -sh dist']
depends = ['pnpm-install', 'clean']

[tasks.preview]
description = 'Serves the built site locally'
run = 'pnpm preview'

[tasks.publish-preview]
description = 'Publishes dist/ to the pgs.sh preview'
run = ['rsync -rv dist/ pgs.sh:/thefocus-landing/']

[tasks.deploy]
description = 'Deploy the preview site'
run = 'mise run publish-preview'

[tasks.lint]
description = 'Validate Astro content/types'
run = 'pnpm exec astro sync'

[tasks.test]
description = 'Build the site as a smoke test'
run = 'mise run build'
